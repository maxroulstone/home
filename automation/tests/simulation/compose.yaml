name: home-automation-sim

services:
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:2026.10.4
    environment:
      TZ: Europe/London
    ports:
      - "127.0.0.1:18123:8123"
    volumes:
      - ha-config:/config
      - ./ha/configuration.yaml:/config/configuration.yaml:ro

volumes:
  ha-config:
