homeassistant:
  name: Automation simulation
  time_zone: Europe/London
  latitude: 0
  longitude: 0
  elevation: 0

# Only the UI/API and local state history; device integrations are added explicitly.
frontend:
api:
http:
config:
history:
recorder:

# A harmless entity for the client integration test; no physical device involved.
input_boolean:
  simulation_probe:
    name: Simulation probe
    initial: false

# HA handles commands and stores the virtual light's state in optimistic mode.
# Empty action lists deliberately avoid calling any physical integration.
template:
  - light:
      - name: Lounge
        unique_id: simulation_lounge
        optimistic: true
        turn_on: []
        turn_off: []
        set_level: []
        set_temperature: []
        set_rgb: []

lovelace:
  mode: yaml
