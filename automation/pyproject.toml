[project]
name = "automation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Max Roulstone", email = "max@the-shack.net" }
]
requires-python = ">=3.14"
dependencies = [
    "websockets>=17.2",
]

[project.scripts]
automation = "automation:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
